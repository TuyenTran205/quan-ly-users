<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ứng dụng Quản lý công việc To-Do List với TypeScript và Bootstrap 5" />
  <title>Quản Lý Công Việc - To-Do List</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .navbar-gradient {
      background: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
    }
    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }
    .form-control:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 0.25rem rgba(2, 132, 199, 0.15);
    }
    .btn-primary {
      background-color: #0284c7;
      border-color: #0284c7;
    }
    .btn-primary:hover {
      background-color: #0369a1;
      border-color: #0369a1;
    }
    .todo-completed {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .list-group-item {
      border-radius: 10px !important;
      margin-bottom: 8px;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease-in-out;
    }
    .list-group-item:hover {
      background-color: #f8fafc;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark navbar-gradient shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 font-weight-bold fs-4" href="#">
        <i class="bi bi-check2-square"></i>
        <span>To-Do List</span>
      </a>
      <!-- Nút chuyển sang trang Quản lý Nhân viên -->
      <a href="index.html" class="btn btn-outline-light d-flex align-items-center gap-2 px-3 py-2 rounded-pill">
        <i class="bi bi-people-fill"></i>
        <span>Quản lý Nhân viên</span>
      </a>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card p-4">
          
          <div class="border-bottom pb-3 mb-4">
            <h1 class="h4 mb-1 font-semibold text-slate-800">
              <i class="bi bi-card-checklist me-2 text-info"></i>Danh Sách Công Việc
            </h1>
            <p class="text-muted small mb-0">Thêm mới, theo dõi trạng thái hoàn thành và xóa các việc cần làm</p>
          </div>

          <!-- Form Thêm Công Việc Mới -->
          <form id="todo-form" class="mb-4">
            <div class="input-group">
              <input 
                type="text" 
                id="todo-input" 
                class="form-control form-control-lg fs-6" 
                placeholder="Nhập tên công việc mới..." 
                required 
              />
              <button type="submit" class="btn btn-primary d-flex align-items-center gap-2 px-4">
                <i class="bi bi-plus-lg"></i>
                <span class="fw-medium">Thêm công việc</span>
              </button>
            </div>
          </form>

          <!-- Danh Sách Công Việc (UL) -->
          <ul id="todo-list" class="list-group">
            <!-- Dữ liệu công việc sẽ được TypeScript render tại đây -->
          </ul>

        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script ES Module chỉ tới todoMain.js trong folder dist -->
  <script type="module" src="./dist/todoMain.js"></script>
</body>
</html>
