<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Hệ thống quản lý nhân sự - Thêm, sửa, xóa thông tin nhân viên dễ dàng và tiện lợi."
        />
        <title>Hệ Thống Quản Lý Nhân Sự</title>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <!-- Bootstrap Icons -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Plus Jakarta Sans", sans-serif;
                background-color: #f8fafc;
                color: #1e293b;
            }
            .navbar-gradient {
                background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            }
            .card {
                border: none;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            }
            .modal-content {
                border: none;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            }
            .form-control:focus,
            .form-select:focus {
                border-color: #3b82f6;
                box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.15);
            }
            .btn-primary {
                background-color: #2563eb;
                border-color: #2563eb;
            }
            .btn-primary:hover {
                background-color: #1d4ed8;
                border-color: #1d4ed8;
            }
            .table thead {
                background-color: #f1f5f9;
                color: #475569;
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <!-- Navbar -->
        <nav class="navbar navbar-dark navbar-gradient shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2 font-weight-bold fs-4" href="#">
                    <i class="bi bi-people-fill"></i>
                    <span>Quản Lý Nhân Sự</span>
                </a>
                <a href="todo.html" class="btn btn-outline-light d-flex align-items-center gap-2 px-3 py-2 rounded-pill">
                    <i class="bi bi-check2-square"></i>
                    <span>To-Do List</span>
                </a>
            </div>
        </nav>

        <!-- Main Layout Căn Giữa Màn Hình -->
        <main class="container mb-5">
            <div class="row">
                <div class="col-12">
                    <div class="card p-4">
                        <!-- Tiêu đề Bảng & Nút Mở Modal Thêm Mới -->
                        <div
                            class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4 border-bottom pb-3"
                        >
                            <div>
                                <h1 class="h4 mb-1 font-semibold text-slate-800">
                                    <i class="bi bi-list-task me-2 text-primary"></i>Danh Sách Nhân Viên
                                </h1>
                                <p class="text-muted small mb-0">
                                    Quản lý và cập nhật thông tin chi tiết nhân sự toàn công ty
                                </p>
                            </div>
                            <div>
                                <button
                                    class="btn btn-primary d-flex align-items-center gap-2 px-3 py-2 shadow-sm"
                                    id="open-add-modal-btn"
                                >
                                    <i class="bi bi-plus-lg"></i>
                                    <span class="fw-medium">Thêm mới nhân viên</span>
                                </button>
                            </div>
                        </div>

                        <!-- Bảng Danh Sách Nhân Viên -->
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th scope="col">ID</th>
                                        <th scope="col">Họ và tên</th>
                                        <th scope="col">Email</th>
                                        <th scope="col">Chức vụ</th>
                                        <th scope="col">Phòng ban</th>
                                        <th scope="col" class="d-none d-md-table-cell">Quê quán</th>
                                        <th scope="col" class="d-none d-lg-table-cell">Ngày sinh</th>
                                        <th scope="col" class="d-none d-md-table-cell">Ngày làm việc</th>
                                        <th scope="col" class="text-end">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody id="user-table-body">
                                    <!-- Dữ liệu được render bằng TypeScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bootstrap 5 Modal chứa Form Thêm / Sửa Nhân Viên -->
        <div class="modal fade" id="user-modal" tabindex="-1" aria-labelledby="form-title" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <!-- Modal Header -->
                    <div class="modal-header bg-light border-bottom">
                        <div class="d-flex align-items-center gap-2">
                            <h5 class="modal-title font-semibold mb-0" id="form-title">
                                <i class="bi bi-person-plus-fill me-2 text-primary"></i>Thêm Nhân Viên
                            </h5>
                            <span class="badge bg-primary-subtle text-primary" id="form-mode-badge">Tạo mới</span>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <!-- Form trong Modal -->
                    <form id="user-form" data-mode="create">
                        <!-- Modal Body -->
                        <div class="modal-body p-4">
                            <input type="hidden" id="user-id" value="" />

                            <div class="row g-3">
                                <!-- Họ và tên -->
                                <div class="col-md-6">
                                    <label for="full-name" class="form-label font-medium fs-7"
                                        >Họ và tên <span class="text-danger">*</span></label
                                    >
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="full-name"
                                        placeholder="Nguyễn Văn A"
                                        required
                                    />
                                </div>

                                <!-- Email -->
                                <div class="col-md-6">
                                    <label for="email" class="form-label font-medium fs-7"
                                        >Email <span class="text-danger">*</span></label
                                    >
                                    <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        placeholder="example@company.com"
                                        required
                                    />
                                </div>

                                <!-- Chức vụ -->
                                <div class="col-md-6">
                                    <label for="position" class="form-label font-medium fs-7"
                                        >Chức vụ <span class="text-danger">*</span></label
                                    >
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="position"
                                        placeholder="Frontend Developer"
                                        required
                                    />
                                </div>

                                <!-- Phòng ban -->
                                <div class="col-md-6">
                                    <label for="department" class="form-label font-medium fs-7"
                                        >Phòng ban <span class="text-danger">*</span></label
                                    >
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="department"
                                        placeholder="Kỹ thuật"
                                        required
                                    />
                                </div>

                                <!-- Quê quán -->
                                <div class="col-md-6">
                                    <label for="hometown" class="form-label font-medium fs-7"
                                        >Quê quán <span class="text-danger">*</span></label
                                    >
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="hometown"
                                        placeholder="Thanh Hóa"
                                        required
                                    />
                                </div>

                                <!-- Ngày sinh -->
                                <div class="col-md-3">
                                    <label for="date-of-birth" class="form-label font-medium fs-7"
                                        >Ngày sinh <span class="text-danger">*</span></label
                                    >
                                    <input type="date" class="form-control" id="date-of-birth" required />
                                </div>

                                <!-- Ngày làm việc chính thức -->
                                <div class="col-md-3">
                                    <label for="start-date" class="form-label font-medium fs-7"
                                        >Ngày vào làm <span class="text-danger">*</span></label
                                    >
                                    <input type="date" class="form-control" id="start-date" required />
                                </div>
                            </div>
                        </div>

                        <!-- Modal Footer -->
                        <div class="modal-footer bg-light border-top">
                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                id="cancel-btn"
                                data-bs-dismiss="modal"
                            >
                                Hủy
                            </button>
                            <button type="submit" class="btn btn-primary" id="submit-btn">
                                <i class="bi bi-check-lg me-1"></i>Lưu thông tin
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Bootstrap 5 JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Main Entry JS -->
        <script type="module" src="./dist/main.js"></script>
    </body>
</html>
